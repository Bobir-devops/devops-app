  @keyframes dSeq   {0%,6%{opacity:.18} 14%,26%{opacity:1} 34%,100%{opacity:.18}}

<div style="min-height:100vh;background:var(--bg);color:var(--ink);padding:0 0 120px">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,40px)">

    <div style="display:flex;flex-wrap:wrap;gap:6px;padding:16px 0 0">

      <a href="cheat.html" style="font:500 12.5px Lora,sans-serif;letter-spacing:.04em;padding:8px 14px;border:1px solid rgb(var(--ink-rgb) / 0.18);color:rgb(var(--ink-rgb) / 0.8);text-decoration:none">Cheat sheet →</a>

    <div style="padding:26px 0 34px;border-bottom:1px solid rgb(var(--ink-rgb) / 0.11)">
      <div style="font:500 12px Lora,ui-sans-serif,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:oklch(calc(var(--lk) * 0.48 + var(--lb)) 0.11 68)">Galereya</div>
      <h1 style="font:500 clamp(32px,5.5vw,62px)/1.04 'Cormorant Garamond',ui-sans-serif,sans-serif;letter-spacing:-.035em;margin:16px 0 18px;max-width:860px">119 harakatdagi sxema</h1>
      <p style="font:400 clamp(17px,2.4vw,20px)/1.6 Lora,Georgia,serif;color:rgb(var(--ink-rgb) / 0.9);max-width:640px;margin:0;text-wrap:pretty">Besh mavzuning barcha sxemasi bir joyda. Mavzu bo'yicha filtrlang yoki nom bilan qidiring — har sxemadan o'z bo'limiga o'tish mumkin.</p>
    </div>

    <div style="position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid rgb(var(--ink-rgb) / 0.13);padding:14px 0">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px">
        <input data-fq="" type="search" placeholder="sxema nomi yoki atama…" style="flex:1 1 240px;background:var(--bg2);border:1px solid rgb(var(--ink-rgb) / 0.22);color:var(--ink);font:400 15px/1.4 Lora,Georgia,serif;padding:10px 13px;outline:none">
        <span data-fcount="" style="font:500 12.5px 'IBM Plex Mono',monospace;color:rgb(var(--ink-rgb) / 0.73)"></span>
      </div>
      <div data-ffilters="" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div data-gallery="" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;padding:22px 0"></div>
  </div>
</div>

<script>
class DCLogic{constructor(){this.props={};this.state={}}setState(u){this.state=Object.assign({},this.state,typeof u==='function'?u(this.state):u)}forceUpdate(){}}

const SG = "Lora,ui-sans-serif,sans-serif", MO = "'IBM Plex Mono',monospace", NR = 'Lora,Georgia,serif';
const CY = 'oklch(calc(var(--lk) * 0.5 + var(--lb)) 0.11 68)', YE = 'oklch(calc(var(--lk) * 0.54 + var(--lb)) 0.08 40)';
const el = (t, css, txt) => { const d = document.createElement(t); if (css) d.style.cssText = css; if (txt != null) d.textContent = txt; return d; };
const norm = (t) => (t || '').toLowerCase().replace(/[‘’'`´]/g, '').replace(/[^a-z0-9\u0400-\u04ff\/\-\.\s]/g, ' ');

class Component extends DCLogic {
  figs() { return window.DevOpsFigs || []; }

  buildFilters() {
    const host = document.querySelector('[data-ffilters]');
    if (!host || host.children.length) return;
    this.active = new Set();
    const subs = [];
    this.figs().forEach((f) => { if (!subs.some((x) => x.name === f.subject)) subs.push({ name: f.subject, color: f.color }); });
    const all = el('button', "font:500 12px " + SG + ";letter-spacing:.04em;padding:7px 12px;border:1px solid oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.55);background:oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.06);color:var(--ink);cursor:pointer", 'Hammasi');
    all.type = 'button';
    all.onclick = () => {
      this.active.clear();
      host.querySelectorAll('button').forEach((b, i) => {
        const on = i === 0;
        b.style.borderColor = on ? 'oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.55)' : 'rgb(var(--ink-rgb) / 0.2)';
        b.style.background = on ? 'oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.06)' : 'transparent';
        b.style.color = on ? 'var(--ink)' : 'rgb(var(--ink-rgb) / 0.82)';
      });
      this.render();
    };
    host.appendChild(all);
    subs.forEach((s) => {
      const n = this.figs().filter((f) => f.subject === s.name).length;
      const b = el('button', "font:500 12px " + SG + ";letter-spacing:.04em;padding:7px 12px;border:1px solid rgb(var(--ink-rgb) / 0.2);background:transparent;color:rgb(var(--ink-rgb) / 0.82);cursor:pointer", s.name + ' · ' + n);
      b.type = 'button';
      b.onclick = () => {
        if (this.active.has(s.name)) this.active.delete(s.name); else this.active.add(s.name);
        const on = this.active.has(s.name);
        b.style.borderColor = on ? s.color : 'rgb(var(--ink-rgb) / 0.2)';
        b.style.background = on ? 'color-mix(in oklch, ' + s.color + ' 12%, transparent)' : 'transparent';
        b.style.color = on ? 'var(--ink)' : 'rgb(var(--ink-rgb) / 0.82)';
        const a = host.querySelector('button');
        const none = this.active.size === 0;
        a.style.borderColor = none ? 'oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.55)' : 'rgb(var(--ink-rgb) / 0.2)';
        a.style.background = none ? 'oklch(calc(var(--lk) * 0.56 + var(--lb)) 0.11 68 / 0.06)' : 'transparent';
        a.style.color = none ? 'var(--ink)' : 'rgb(var(--ink-rgb) / 0.82)';
        this.render();
      };
      host.appendChild(b);
    });
    const q = document.querySelector('[data-fq]');
    let t = null;
    if (q) q.oninput = () => { clearTimeout(t); t = setTimeout(() => this.render(), 130); };
  }

  render() {
    const host = document.querySelector('[data-gallery]');
    const cnt = document.querySelector('[data-fcount]');
    if (!host) return;
    const q = (document.querySelector('[data-fq]') || {}).value || '';
    const words = norm(q).split(/\s+/).filter((w) => w.length >= 2);
    let list = this.figs();
    if (this.active && this.active.size) list = list.filter((f) => this.active.has(f.subject));
    if (words.length) {
      list = list.filter((f) => {
        const hay = norm(f.caption + ' ' + f.section + ' ' + f.note + ' ' + f.subject);
        return words.every((w) => hay.includes(w));
      });
    }
    if (cnt) cnt.textContent = list.length + ' sxema';
    host.innerHTML = '';
    list.forEach((f, i) => {
      const box = el('figure', 'margin:0;border:1px solid rgb(var(--ink-rgb) / 0.13);background:var(--bg2);padding:16px;display:flex;flex-direction:column');
      const top = el('div', 'display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:12px');
      top.append(el('div', "font:500 11px " + SG + ";letter-spacing:.18em;text-transform:uppercase;color:" + f.color, f.subject));
      const link = el('a', "font:500 11px " + MO + ";color:rgb(var(--ink-rgb) / 0.6);text-decoration:none;flex:none", f.section ? f.section.slice(0, 34) + ' →' : '');
      link.href = encodeURI(f.file) + '#' + f.sectionId;
      link.onmouseenter = () => { link.style.color = CY; };
      link.onmouseleave = () => { link.style.color = 'rgb(var(--ink-rgb) / 0.6)'; };
      top.appendChild(link);
      box.appendChild(top);
      box.append(el('figcaption', "font:500 11.5px " + SG + ";letter-spacing:.2em;text-transform:uppercase;color:" + YE + ";margin-bottom:12px", f.caption));
      const holder = el('div', 'flex:1');
      holder.innerHTML = f.svg;
      const svg = holder.querySelector('svg');
      if (svg) { svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.display = 'block'; }
      box.appendChild(holder);
      if (f.note) {
        const note = el('div', "font:400 14.5px/1.5 " + NR + ";color:rgb(var(--ink-rgb) / 0.84);margin-top:12px;text-wrap:pretty");
        note.innerHTML = f.note;
        box.appendChild(note);
      }
      host.appendChild(box);
    });
    if (!list.length) {
      const none = el('div', 'background:var(--bg2);padding:22px;border:1px solid rgb(var(--ink-rgb) / 0.13)');
      none.append(el('div', "font:400 16.5px/1.6 " + NR + ";color:rgb(var(--ink-rgb) / 0.84)", "Sxema topilmadi — boshqa atama bilan urinib ko'ring."));
      host.appendChild(none);
    }
  }

  componentDidMount() {
    const boot = () => {
      if (!window.DevOpsFigs) return;
      this.buildFilters();
      this.render();
    };
    [0, 200, 600, 1400, 2600].forEach((d) => setTimeout(boot, d));
  }

  renderVals() { return {}; }
}

(function(){var c=new Component();if(c.componentDidMount)c.componentDidMount();var rv=c.renderVals?c.renderVals():{};
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-go]');if(b&&rv.go)rv.go({currentTarget:b,preventDefault:function(){}});});})();
</script>
